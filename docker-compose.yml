version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: teakees_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: teakees_crm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d teakees_crm"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teakees_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=Teakees Real Estate CRM
      - DATABASE_URL=postgresql+psycopg2://postgres:postgrespassword@db:5432/teakees_crm
      - SECRET_KEY=teakees-production-jwt-secret-key-replace-in-cloud
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=120
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - UPLOAD_DIR=/app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads_data:
