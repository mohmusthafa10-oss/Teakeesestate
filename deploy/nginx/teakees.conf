# ==============================================================================
# Teakees Real Estate CRM — Production Nginx Reverse Proxy Configuration
# ==============================================================================
# This configuration acts as the production reverse proxy in front of Uvicorn/FastAPI.
#
# Upload Limits & Multipart Overhead Accounting:
# - Application-level upload limit: 5 MiB (5,242,880 bytes) binary payload.
# - Multipart/form-data overhead: HTTP headers, MIME boundary delimiters,
#   Content-Disposition headers, and form metadata fields add approximately
#   1 KiB to 64 KiB of frame wrapping overhead per request.
# - If client_max_body_size were set to exactly 5m, any 5 MiB file upload would
#   total ~5.01 MiB and trigger Nginx HTTP 413 (Request Entity Too Large) before
#   reaching FastAPI.
# - Setting: client_max_body_size 8M provides a safe ~3 MiB margin for multipart
#   envelope and form metadata, while strictly preventing DoS from oversized streams.
# ==============================================================================

upstream uvicorn_backend {
    server 127.0.0.1:8000 fail_timeout=10s max_fails=3;
    keepalive 32;
}

# --------------------------------------------------------------------------
# Multi-Worker Edge Rate Limiting Zones (Nginx Level)
# --------------------------------------------------------------------------
# Protects against distributed credential stuffing and brute-force across workers
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name crm.testate.in;

    # Enforce HTTPS redirect in production
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crm.testate.in;

    # SSL Configuration (configure paths according to Let's Encrypt / cert provider)
    # ssl_certificate /etc/letsencrypt/live/crm.testate.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/crm.testate.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Global Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # --------------------------------------------------------------------------
    # Request Body Size: 8M (supports 5 MiB binary payload + multipart packaging)
    # --------------------------------------------------------------------------
    client_max_body_size 8M;
    client_body_buffer_size 128k;

    # --------------------------------------------------------------------------
    # Public Static Media Serving
    # Serves ONLY the designated PUBLIC upload directory.
    # Private media is stored in /var/data/uploads/private and MUST NEVER be aliased here.
    # --------------------------------------------------------------------------
    location /uploads/ {
        alias /var/data/uploads/public/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; media-src 'self';" always;

        # Disable script execution in media directories
        location ~ \.(php|py|sh|pl|cgi|exe|bat|cmd)$ {
            deny all;
        }

        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # Login Rate Limiting (Edge Enforcement)
    # --------------------------------------------------------------------------
    location = /api/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://uvicorn_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # API & Private Media Endpoint Routing
    # Private media downloads (/api/uploads/private/...) route here through FastAPI
    # where session authentication and owner/admin authorization are enforced.
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://uvicorn_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Streaming upload tuning
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # --------------------------------------------------------------------------
    # Frontend Static Single Page Application (SPA)
    # --------------------------------------------------------------------------
    location / {
        root /var/www/teakees-frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
